name: ASC Build & Deploy
on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: 'Bundle ID'
        required: true
        default: 'asopro.test'
      build_type:
        description: 'Build type (testflight or appstore)'
        required: true
        default: 'appstore'
      version:
        description: 'Version string'
        required: true
        default: '1.0'
      asc_key_id:
        description: 'ASC API Key ID'
        required: true
      asc_issuer_id:
        description: 'ASC Issuer ID'
        required: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install ASC CLI
        run: |
          curl -fsSL https://asccli.sh/install | bash

      - name: Setup ASC API Key
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.ASC_PRIVATE_KEY_BASE64 }}" | base64 --decode > ~/private_keys/AuthKey_${{ inputs.asc_key_id }}.p8
          chmod 600 ~/private_keys/AuthKey_${{ inputs.asc_key_id }}.p8

      - name: Install ASC CLI & Login
        run: |
          curl -fsSL https://asccli.sh/install | bash || true
          if command -v asc &> /dev/null; then
            asc auth login \
              --name "CI" \
              --key-id "${{ inputs.asc_key_id }}" \
              --issuer-id "${{ inputs.asc_issuer_id }}" \
              --private-key ~/private_keys/AuthKey_${{ inputs.asc_key_id }}.p8 \
              --bypass-keychain
          fi

      - name: Build Archive
        run: |
          SCHEME=$(xcodebuild -list -json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('project',d.get('workspace',{})).get('schemes',[''])[0])")
          xcodebuild archive \
            -scheme "$SCHEME" \
            -archivePath build/App.xcarchive \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ inputs.asc_key_id }}.p8 \
            -authenticationKeyID "${{ inputs.asc_key_id }}" \
            -authenticationKeyIssuerID "${{ inputs.asc_issuer_id }}" \
            CODE_SIGN_STYLE=Automatic

      - name: Export IPA
        run: |
          cat > ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ inputs.asc_key_id }}.p8 \
            -authenticationKeyID "${{ inputs.asc_key_id }}" \
            -authenticationKeyIssuerID "${{ inputs.asc_issuer_id }}"

      - name: Upload to App Store Connect
        run: |
          IPA_PATH=$(find build/export -name "*.ipa" | head -1)
          if command -v asc &> /dev/null; then
            if [ "${{ inputs.build_type }}" = "testflight" ]; then
              asc builds upload --app "${{ inputs.bundle_id }}" --ipa "$IPA_PATH"
            else
              asc publish appstore --app "${{ inputs.bundle_id }}" --ipa "$IPA_PATH" --version "${{ inputs.version }}" --submit --confirm
            fi
          else
            xcrun altool --upload-app -f "$IPA_PATH" --type ios \
              --apiKey "${{ inputs.asc_key_id }}" \
              --apiIssuer "${{ inputs.asc_issuer_id }}"
          fi

      - name: Cleanup
        if: always()
        run: rm -rf ~/private_keys
